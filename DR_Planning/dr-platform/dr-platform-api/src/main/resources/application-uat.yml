# ============================================================
# DR Platform API — UAT Profile (User Acceptance Testing)
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  cloud:
    vault:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.ldap.LdapRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://uat-db.equitybank.com:5432/dr_platform_uat}
    username: ${DB_USERNAME:dr_platform}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  ldap:
    urls: ${LDAP_URL:ldap://ldap.equitybank.com:389}
    base: ${LDAP_BASE:DC=equitybank,DC=com}
    username: ${LDAP_BIND_DN:CN=svc-drplatform,OU=ServiceAccounts,DC=equitybank,DC=com}
    password: ${LDAP_BIND_PASSWORD:changeme}

  mail:
    host: ${MAIL_HOST:smtp.equitybank.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply-dr-uat@equitybank.co.ke}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  data:
    redis:
      host: ${REDIS_HOST:uat-redis.equitybank.com}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}     # 15 min
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:28800000} # 8 hr

  security:
    allowed-origins: ${ALLOWED_ORIGINS:https://dr-uat.equitybank.co.ke}
    max-login-attempts: 5

  auth:
    allowed-domains: ${ALLOWED_EMAIL_DOMAINS:equitybank.co.ke,gmail.com}
    otp-expiry-minutes: ${OTP_EXPIRY_MINUTES:10}

  ldap:
    dev-mode: ${LDAP_DEV_MODE:false}
    user-search-base: ${LDAP_USER_BASE:OU=Users}
    user-search-filter: ${LDAP_USER_FILTER:(sAMAccountName={0})}
    group-search-base: ${LDAP_GROUP_BASE:OU=Groups}
    role-coordinator: ${LDAP_ROLE_COORDINATOR:DR-Coordinators}
    role-app-owner: ${LDAP_ROLE_APP_OWNER:DR-AppOwners}
    role-super-admin: ${LDAP_ROLE_SUPER_ADMIN:DR-SuperAdmins}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.equitybank.drplatform: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
