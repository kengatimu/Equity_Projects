# ============================================================
# DR Platform API — PROD Profile (Production)
# ALL secrets must be supplied via environment variables.
# No fallback defaults for sensitive values.
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  cloud:
    vault:
      enabled: false
    azure:
      keyvault:
        secret:
          enabled: ${AZURE_KEYVAULT_ENABLED:false}
          endpoint: ${AZURE_KEYVAULT_URI:}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.ldap.LdapRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  ldap:
    urls: ${LDAP_URL}
    base: ${LDAP_BASE}
    username: ${LDAP_BIND_DN}
    password: ${LDAP_BIND_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}     # 15 min
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:28800000} # 8 hr

  security:
    allowed-origins: ${ALLOWED_ORIGINS}
    max-login-attempts: 5

  auth:
    allowed-domains: ${ALLOWED_EMAIL_DOMAINS:equitybank.co.ke}
    otp-expiry-minutes: ${OTP_EXPIRY_MINUTES:10}

  ldap:
    dev-mode: false
    user-search-base: ${LDAP_USER_BASE}
    user-search-filter: ${LDAP_USER_FILTER:(sAMAccountName={0})}
    group-search-base: ${LDAP_GROUP_BASE}
    role-coordinator: ${LDAP_ROLE_COORDINATOR:DR-Coordinators}
    role-app-owner: ${LDAP_ROLE_APP_OWNER:DR-AppOwners}
    role-super-admin: ${LDAP_ROLE_SUPER_ADMIN:DR-SuperAdmins}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  from-number: ${TWILIO_FROM_NUMBER}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.equitybank.drplatform: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
