# ============================================================================
# Production configuration — Equity Bank DR Platform
# Place this file at: dr-platform/config/application-production.yml
# This file is NOT committed — managed by ops / vault injection
# ============================================================================

spring:
  profiles:
    active: production

  datasource:
    url: jdbc:postgresql://db-host:5432/dr_platform
    username: dr_platform_app
    password: ${DB_PASSWORD}               # injected via environment variable or Vault
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  ldap:
    urls: ldap://ldap.equitybank.internal:389
    base: dc=equitybank,dc=internal
    username: ${LDAP_BIND_DN}
    password: ${LDAP_BIND_PASSWORD}

  mail:
    host: smtp.equitybank.internal
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  data:
    redis:
      host: redis-host
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 5000

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

# JWT secrets
dr-platform:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000    # 15 minutes
    refresh-token-expiry-ms: 28800000 # 8 hours
  cors:
    allowed-origins:
      - https://dr-platform.equitybank.internal
      - https://dr.equitybank.co.ke

# Twilio (SMS/WhatsApp notifications)
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token:  ${TWILIO_AUTH_TOKEN}
  from-number: ${TWILIO_FROM_NUMBER}

# Actuator (health endpoint only — no sensitive endpoints exposed)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: WARN
    com.equitybank.drplatform: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
  file:
    name: ../logs/dr-platform.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
