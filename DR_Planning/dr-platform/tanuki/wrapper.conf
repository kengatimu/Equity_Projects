# ============================================================================
# Tanuki Java Service Wrapper Configuration
# Equity Bank DR Management Platform — dr-platform-api
# ============================================================================

# ─── Java Application ────────────────────────────────────────────────────────
wrapper.java.command=java

# Path to the Spring Boot fat JAR (produced by mvn package)
wrapper.java.classpath.1=../dr-platform-api/target/dr-platform-api-1.0.0-SNAPSHOT.jar

# JVM main class — Spring Boot's executable launcher
wrapper.java.mainclass=org.springframework.boot.loader.launch.JarLauncher

# ─── JVM Arguments ───────────────────────────────────────────────────────────
wrapper.java.additional.1=-server
wrapper.java.additional.2=-Xms512m
wrapper.java.additional.3=-Xmx2g
wrapper.java.additional.4=-XX:+UseG1GC
wrapper.java.additional.5=-XX:+HeapDumpOnOutOfMemoryError
wrapper.java.additional.6=-XX:HeapDumpPath=../logs/heapdump.hprof
wrapper.java.additional.7=-Dspring.profiles.active=production
wrapper.java.additional.8=-Dfile.encoding=UTF-8
wrapper.java.additional.9=-Djava.security.egd=file:/dev/./urandom
wrapper.java.additional.10=-Dserver.port=8080

# ─── Application Arguments ───────────────────────────────────────────────────
# Override specific Spring Boot properties at launch time
wrapper.app.parameter.1=--spring.config.location=file:../config/application-production.yml

# ─── Service Identity ─────────────────────────────────────────────────────────
wrapper.name=drplatform
wrapper.displayname=Equity Bank DR Management Platform
wrapper.description=Disaster Recovery Management Platform — Equity Group Holdings

# ─── Logging ─────────────────────────────────────────────────────────────────
wrapper.logfile=../logs/wrapper.log
wrapper.logfile.maxsize=50m
wrapper.logfile.maxfiles=10
wrapper.logfile.loglevel=INFO
wrapper.console.loglevel=INFO
wrapper.syslog.loglevel=ERROR

# ─── Restart policy ──────────────────────────────────────────────────────────
# Restart automatically on non-zero exit (crash recovery)
wrapper.on_exit.default=RESTART
# But NOT on clean exit (exit code 0)
wrapper.on_exit.0=SHUTDOWN

# Restart delays: 5s, 10s, 30s, then every 60s
wrapper.restart.delay_1=5
wrapper.restart.delay_2=10
wrapper.restart.delay_3=30
wrapper.restart.delay.default=60

# Maximum 5 restarts within 5 minutes before giving up
wrapper.max_failed_invocations=5

# ─── Startup / Shutdown ──────────────────────────────────────────────────────
# Allow 120 seconds for Spring Boot to start (LDAP + DB + Flyway migrations)
wrapper.startup.timeout=120
# Allow 30 seconds for graceful shutdown
wrapper.shutdown.timeout=30

# ─── JVM health / ping ───────────────────────────────────────────────────────
wrapper.ping.timeout=60
wrapper.ping.interval=10

# ─── Windows service (if deployed on Windows) ────────────────────────────────
wrapper.ntservice.name=drplatform
wrapper.ntservice.displayname=Equity Bank DR Platform
wrapper.ntservice.description=Disaster Recovery Management Platform
wrapper.ntservice.starttype=AUTO_START
wrapper.ntservice.interactive=false
wrapper.ntservice.account=
wrapper.ntservice.password=

# ─── Linux / Unix (if deployed on Linux) ─────────────────────────────────────
# Run as a non-root service user
# wrapper.run_as_user=svcdrplatform

# PID file for init.d / systemd integration
wrapper.pidfile=../run/drplatform.pid

# ─── JVM path override (uncomment and set if Java not on PATH) ───────────────
# wrapper.java.command=/opt/java/21/bin/java
