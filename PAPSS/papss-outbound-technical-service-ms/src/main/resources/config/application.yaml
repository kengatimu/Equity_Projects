#actuator configs
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    jolokia:
      enabled: true
    shutdown:
      enabled: true #for gracefully shutting down the app - http://localhost:<PortNumber>/actuator/shutdown
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true