# ------------------------------------------------------------
# ASYNC THREAD POOL
# ------------------------------------------------------------
async:
  core-pool-size: 20        # Always keep 20 threads alive
  max-pool-size: 50         # Can burst up to 50 during spikes
  queue-capacity: 5000      # Buffer up to 5k tasks before rejecting
  keep-alive-seconds: 60    # Non-core threads live for 60s when idle

# ------------------------------------------------------------
# DATASOURCE
# ------------------------------------------------------------
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: oracle.jdbc.OracleDriver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      poolName: Hikari
      auto-commit: false
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 30000  # Close idle connections after 30s
      connection-timeout: 20000  # Wait max 20s for a connection
      max-lifetime: 1800000  # Recycle connections every 30 mins
      # leak-detection-threshold: 15000  # Detect leaked connections after 15s
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 500
        prepStmtCacheSqlLimit: 4096
        useServerPrepStmts: true
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.OracleDialect
      ddl-auto: validate
    show-sql: false

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

# ------------------------------------------------------------
# PAPSS ENDPOINTS
# ------------------------------------------------------------
service:
  urls:
    common-url: 'https://pm.prod.papssnet.papss.com/papss/Message'
    fx-rate-base-url: 'https://pm.prod.papssnet.papss.com/papss/FXRate'
    post-fx-rate-url: 'https://pm.prod.papssnet.papss.com/papss/FXRateApi'
    participants-base-url: 'https://pm.prod.papssnet.papss.com/papss/api/participants'

# ------------------------------------------------------------
# ACCOUNT DETAILS
# ------------------------------------------------------------
accounts:
  credit-gl:
    papss-settlement:
      kes: ${PAPSS_SETTLEMENT_KES}
      usd: ${PAPSS_SETTLEMENT_USD}
    bank-income:
      kes: ${PAPSS_BANK_INCOME_KES}
      usd: ${PAPSS_BANK_INCOME_KES}

# ------------------------------------------------------------
# LIMITS
# ------------------------------------------------------------
limits:
  outbound:
    max-transaction-limit: 999999
    daily-transaction-limit: 999999
    velocity-limit: 99999999
