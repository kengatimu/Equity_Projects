spring:
  application:
    name: papss-middleware-service
  datasource:
    url: ${PAPSS_DB_URL:jdbc:postgresql://localhost:5432/papssdb}
    username: ${PAPSS_DB_USERNAME:papss}
    password: ${PAPSS_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariCP
      auto-commit: false
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 5000
      initialization-fail-timeout: 1
      connection-test-query: SELECT 1

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        boot.allow_jdbc_metadata_access: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        connection.provider_disables_autocommit: true
    open-in-view: false


logging:
  level:
    com.papss.middleware: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
    org.apache.http: DEBUG

