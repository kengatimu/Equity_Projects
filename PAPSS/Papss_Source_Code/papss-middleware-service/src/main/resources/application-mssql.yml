spring:
  application:
    name: papss-middleware-service
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=papss_middlewareDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: yourStrong(!)Password
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: HikariCP
      auto-commit: false
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 5000
      initialization-fail-timeout: 1

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        boot.allow_jdbc_metadata_access: false
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        connection.provider_disables_autocommit: true
    open-in-view: false


logging:
  level:
    com.papss.middleware: DEBUG
    org.springframework.web.client.RestTemplate: INFO
    org.apache.http: DEBUG

