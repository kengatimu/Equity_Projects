logging:
  level:
    ROOT: INFO
    com.equitybank.gag.registry: INFO

spring:
  profiles:
    active: dev
  application:
    name: eureka-registry-ms

server:
  port: 8765

eureka:
  instance:
    hostname: eureka-registry-ms
    instanceId: ${spring.application.name}:${hostname}:${server.port}
    prefer-ip-address: false  # Using hostname instead of IP
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

  client:
    enabled: true
    fetch-registry: false  # Since this is the registry, it doesn’t fetch other instances
    register-with-eureka: false  # This service is the registry itself
    instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 10
    service-url:
      defaultZone: http://localhost:${server.port}/eureka/

  server:
    enable-self-preservation: false
    peer-node-read-timeout-ms: 30000

  dashboard:
    path: /  # Default Eureka dashboard path
