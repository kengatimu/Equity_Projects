# enable this if you want to skip host verification, or trust all certs during mtls handshake
http:
  ssl:
    trust-all: true
    skip-hostname-verification: true

# Async thread configs
async:
  core-pool-size: 20        # Always keep 20 threads alive
  max-pool-size: 50         # Can burst up to 50 during spikes
  queue-capacity: 5000      # Buffer up to 5k tasks before rejecting
  keep-alive-seconds: 60    # Non-core threads live for 60s when idle

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/papss?useSSL=false&allowPublicKeyRetrieval=true
    username: bishop
    password: bishop
    hikari:
      poolName: Hikari
      auto-commit: false
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000  # Close idle connections after 30s
      connection-timeout: 20000  # Wait max 20s for a connection
      max-lifetime: 1800000  # Recycle connections every 30 mins
      # leak-detection-threshold: 15000  # Detect leaked connections after 15s
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 500
        prepStmtCacheSqlLimit: 4096
        useServerPrepStmts: true
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect  # Update dialect for MySQL 8
      ddl-auto: none
    show-sql: false

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

# PAPSS Urls
service:
  ips-domain: 'pm.test.papssnet.papss.com'
  ips-port: '443'
  urls:
    ack-url: 'https://127.0.0.1:9443/papss/MessageAck'
    common-url: 'https://127.0.0.1:9443/papss/Message'

