logging:
  level:
    ROOT: INFO
    org.hibernate: INFO
    com.equitybank.gag.telco_b2c: INFO
    com.netflix.discovery.DiscoveryClient: INFO

# ssl configs
server:
  port: 9443
  ssl:
    enabled: true
    key-store: '/Users/bishop/Programming/projects/work/WorkSpace/NetBeans/GAG/GAGApplications/PAPSS/certs/uat/equity-gag-side/outbound/papss-equitygroup.p12'
    key-store-password: 'papss-equitygroup!'
    key-store-type: PKCS12
    key-alias: papss-equitygroup
    trust-store: '/Users/bishop/Programming/projects/work/WorkSpace/NetBeans/GAG/GAGApplications/PAPSS/certs/uat/equity-gag-side/outbound/truststore-papss-equitygroup.p12'
    trust-store-password: 'papss-equity!'
    trust-store-type: PKCS12
    trust-aliases:
      papss: papss-moc
      omni: omni
      remittance: remittance

# enable this if you want to skip host verification, or trust all certs during mtls handshake
http:
  ssl:
    trust-all: true
    skip-hostname-verification: true

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/papss?useSSL=false&allowPublicKeyRetrieval=true
    username: bishop
    password: bishop
    hikari:
      poolName: Hikari
      auto-commit: false
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 30000  # Close idle connections after 30s
      connection-timeout: 20000  # Wait max 20s for a connection
      max-lifetime: 1800000  # Recycle connections every 30 mins
      # leak-detection-threshold: 15000  # Detect leaked connections after 15s
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 500
        prepStmtCacheSqlLimit: 4096
        useServerPrepStmts: true
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect  # Update dialect for MySQL 8
      ddl-auto: update
    show-sql: false

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
equity:
  urls:
    namecheck: 'https://localhost:12443/api/v1/inbound/namecheck'
    transaction: 'https://localhost:12443/api/v1/inbound/credit-transfer'
    status-check: 'https://localhost:12443/api/v1/inbound/txnstatusquery'
