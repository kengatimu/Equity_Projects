<SCRIPT>
function displayErrorMessage(errorMessage){
        for(i=0; i< errorMessage.length ; i++){

            oNewNode = document.createElement("TR");
            TBODY_TLErrorRecordSet.appendChild(oNewNode);

            var tdNode0 = document.createElement("TD");
            oNewNode.appendChild(tdNode0);
            tdNode0.innerHTML =  "<STRONG><FONT COLOR='red' SIZE='1' FACE='ARIAL, HELVETICA'> *</FONT></STRONG><SPAN class='errmsg'> " + errorMessage[i] + "</SPAN>";
        }
        return true;
}

function clearMessages(){
    var len = document.all.TBODY_TLErrorRecordSet.rows.length;
    for (i=len-1; i >= 0 ; i--){
        document.all.TBODY_TLErrorRecordSet.deleteRow(i);
    }
}
</SCRIPT>
