            function accountLookup() {
                var productProcessorObj = document.getElementsByName("UFS2")[0];
                if( productProcessorObj.value != "" ) {
				<!-- Tracker ID :756914 - Chrome Porting Changes -->
                    var obj1 = parent.frames[0].document.getElementsByName("UFS2")[0];
                    var obj2 = parent.frames[0].document.getElementsByName("UFS5")[0];

            function objectLookup() {

                var objectTypeObj = document.getElementsByName("UFS3")[0];
                if( objectTypeObj.value != "" ) {
				<!-- Tracker ID :756914 - Chrome Porting Changes -->
                    var obj1 = parent.frames[0].document.getElementsByName("UFS2")[0];
                    var obj2 = parent.frames[0].document.getElementsByName("UFS5")[0];

                    date = new Date();
                    var entityType = "";
                    var customerKey = "";
                    var contactKey = "";
                    var prospectKey = "";
                    var createdOn = "";
                    var modifiedOn = "";
                    operationObj = document.getElementsByName("SupportingObjType")[0];
                    if(operationObj.value == 'Created'){
                        createdOn = date;
                    } else if(operationObj.value == 'Modified'){
                        modifiedOn = date;
                    }
                    if(obj1.value != ''){
                        if(obj2.value != ''){
                            if(obj1.value == 'CSKY'){
                                customerKey = obj2.value;
                            }else if(obj1.value == 'COKY'){
                                contactKey = obj2.value;
                            }else if(obj1.value == 'PKY'){
                                prospectKey = obj2.value;
                            }
                        }
                    }

                    if(objectTypeObj.value == "Incident" ) {
                        if(obj1.value != ''){
                            if(obj1.value == 'CSKY'){
                                entityType = "CUSTOMER";
                            }else if(obj1.value == 'COKY'){
                                entityType = "CONTACT";
                            }else if(obj1.value == 'PKY'){
                                entityType = "PROSPECT";
                            }
                        }
                        lookupFor = "ForIncident";
                        var newwin = window.open('../../servlet/com.infy.cis.ui.common.Lookup?Mode=ForIncident&AccountKey='+customerKey+'&ContactKey='+contactKey+'&ProspectKey='+prospectKey+'&EntityType='+entityType+'&CreatedOn='+createdOn+'&ModifiedOn='+modifiedOn,
                             'Lookup',
                             'height=600,width=800,left=75,top=100,resizable=yes,titlebar=no,toolbar=no,status=yes,scrollbars');
                    }else if( objectTypeObj.value == "Opportunity" ) {
                        if(obj1.value != ''){
                            if(obj1.value == 'CSKY'){
                                entityType = "Customer";
                            }else if(obj1.value == 'COKY'){
                                entityType = "Contact";
                            }else if(obj1.value == 'PKY'){
                                entityType = "Prospect";
                            }
                        }

                        lookupFor = "ForOpportunity";
                        var newwin = window.open('../../servlet/com.infy.cis.ui.common.Lookup?Mode=ForOpportunity&AccountKey='+customerKey+'&ContactKey='+contactKey+'&ProspectKey='+prospectKey+'&EntityType='+entityType+'&CreatedOn='+createdOn+'&ModifiedOn='+modifiedOn,
                             'Lookup',
                             'height=600,width=800,left=75,top=100,resizable=yes,titlebar=no,toolbar=no,status=yes,scrollbars');
                    }
                }
                else {
                    showMessage(getUserErrorMessage('MSG213',objectTypeObj.Display));
                }
            }
