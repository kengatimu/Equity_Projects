trigger:
  branches:
    include:
      - main

  paths:
    include:
      - USER/*  # Triggers The Pipeline Only When Files In USER Are Changed

variables:
  tag: '$(Build.BuildId)'

  # Agent VM image name - linux
  vmImageName: 'devops-ubuntu'
  azureSubscription: 'Enterprise Dev/Test'
  azureSubscriptionProd: 'Enterprise Production'

stages:
  - stage: BuildHPPROD
    condition: and(always(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    displayName: HP-PROD-USER
    jobs:
      - job: Build
        displayName: 'HP Prod Build Stage'
        pool:
          name: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 200

          - task: CmdLine@2
            displayName: 'Run Script Create Tag USER-Tag'
            inputs:
              script: |
                if [ "$(Build.SourceBranch)" == "refs/heads/main" ] && [ "$(Build.Reason)" == "IndividualCI" ] && [ "$(Build.SourceBranch)" == "$(Build.SourceBranch)" ]; then
                    export AZURE_DEVOPS_EXT_PAT=$(System.AccessToken)
                    az pipelines build tag add --build-id $(Build.BuildId) --tags USER-Tag
                fi

          - task: Bash@3
            displayName: Checking For New/Modified Files
            inputs:
              targetType: 'filePath'
              filePath: check-modified-files.sh

          - task: CopyFiles@2
            displayName: 'Copying Files To Stagging Directory'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                **/finacleFileType/*
                **/modifiedFiles/*
                **/deletedFiles/*
                **/newFiles/*
                !**/*.gitkeep
                !**/*.git/**
                !**/*.git
                !**/*.yaml
                !**/*.yml
                !**/*.md
              TargetFolder: '$(build.artifactstagingdirectory)'

          - task: CmdLine@2
            displayName: Archiving Finacle Files
            inputs:
              script: |
                #This archiving includes empty directories, unlike azure ArchiveFiles@2
                echo "Archiving Finacle USER Directory In The Staging Directory"
                tar -vzcf $(Build.SourcesDirectory)/finacle-USER-scripts.tar.gz $(build.artifactstagingdirectory)

                echo "Copying The Archives Into The Staging Directory"
                cp -vr $(Build.SourcesDirectory)/finacle-USER-scripts.tar.gz $(build.artifactstagingdirectory)/

                echo "Displaying The Contents Of Staging Directory"
                ls -lart $(build.artifactstagingdirectory)

          - task: CmdLine@2
            displayName: List Items Of The Archive
            inputs:
              script: |
                cd $(build.artifactstagingdirectory)
                echo "Listing Items In The finacle-USER-scripts.tar.gz Archive"
                tar -ztvf finacle-USER-scripts.tar.gz

          - task: CmdLine@2
            displayName: Creating Publishing Directory
            inputs:
              script: |
                echo "Creating Publishing Directory"
                cd $(build.artifactstagingdirectory)
                mkdir -v publishUSERScriptsDir

                echo "Copying The Archives Into The Publishing Directory"
                cp -vr finacle-USER-scripts.tar.gz $(build.artifactstagingdirectory)/publishUSERScriptsDir

                echo "Copying deploy scripts.sh Into The Publishing Directory"
                cp -vr $(Build.SourcesDirectory)/deploy-user-scripts.sh $(build.artifactstagingdirectory)/publishUSERScriptsDir

          - task: PublishBuildArtifacts@1
            displayName: Publish Build Artifacts On user_drop
            inputs:
              PathtoPublish: $(build.artifactstagingdirectory)/publishUSERScriptsDir
              ArtifactName: user_drop
              publishLocation: Container
